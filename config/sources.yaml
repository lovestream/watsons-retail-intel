# ================================================================
# sources.yaml V4 — 按 RSSHub 采集配置指引 V2 重构
#
# 设计原则：
#   - RSSHub 为主力（高召回，免费，31个源）
#   - XCrawl 严格限流（2 queries/天，用于当日热点补漏）
#   - Tavily 严格限流（2 queries/天，用于长尾补漏）
#   - filterout_days=1 严格限定当天
#   - 频道源(feed) 优先保证时效；搜索源(search) 按相关性排序，仅作线索
# ================================================================

rsshub_base: http://192.168.2.100:1200

defaults:
  timeout_seconds: 20
  max_items_per_route: 20
  request_interval_seconds: 0.5
  allow_unknown_time: true
  allow_old: false
  filterout_days: 1

collection_limits:
  max_total_items_before_dedup: 800
  max_items_after_dedup: 300
  max_items_for_fulltext: 80
  max_items_for_filter_skill: 300

