# ================================================================
# XCrawl（严格限流：仅2个源，1 query/源 = 2 queries/天，≈4 credits/天）
# ================================================================
xcrawl:
  keys_env_vars:
  - xcrawl_key
  - xcrawl_key1
  - xcrawl_key2
  monthly_limit_per_key: 1000

other_sources:

  - id: xcrawl_daily_headlines
    name: XCrawl-当日即时零售头条
    method: xcrawl
    search_queries:
    - 即时零售 最新 新闻
    description: ⚠️ 限流：每日仅1 query，用于补漏当日突发重大新闻
    source_tier: 2
    role: clue_discovery
    category: 即时零售
    enabled: true
    max_items: 8
    daily_priority: 40

  - id: xcrawl_watsons_beauty
    name: XCrawl-屈臣氏美妆即时零售
    method: xcrawl
    search_queries:
    - 屈臣氏 美妆 即时零售
    description: ⚠️ 限流：每日仅1 query
    source_tier: 2
    role: competitor_signal
    category: 竞对
    enabled: true
    max_items: 8
    daily_priority: 35

  # ── Tavily 补漏源（严格限流）──

  - id: tavily_gap_fill
    name: Tavily-即时零售补漏
    method: tavily
    search_queries:
    - 即时零售 最新 动态
    description: ⚠️ 限流：每日仅1 query，补漏 RSSHub 未覆盖的长尾信息
    source_tier: 3
