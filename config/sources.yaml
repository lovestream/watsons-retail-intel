# ================================================================
# sources.yaml V3 — 信息源配置（精简重构版）
# 
# 设计原则：
#   - XCrawl 为主力（中文新闻时效性最佳）
#   - RSSHub 关键词搜索为辅助（只保留高相关路由）
#   - Tavily 为补充（覆盖面广但中文时效性一般）
#   - Web 直连为专项补充
#   - filterout_days=1 严格限定当天
# ================================================================

rsshub_base: http://192.168.2.100:1200

defaults:
  timeout_seconds: 20
  max_items_per_route: 15          # 降低避免噪音
  request_interval_seconds: 0.5
  allow_unknown_time: false         # 未知时间的文章默认拒绝
  allow_old: false
  filterout_days: 1                 # ⚠️ 只保留24h内文章！

collection_limits:
  max_total_items_before_dedup: 800
  max_items_after_dedup: 400
  max_items_for_fulltext: 200
  max_items_for_filter_skill: 400

# ── Tavily 配置 ──
tavily:
  rotation: round_robin
  keys_env_vars:
  - tavily_key
  - tavily_key1
  - tavily_key2
  monthly_limit_per_key: 1000
  timeout_seconds: 30
  max_results_per_query: 10
  search_depth: advanced

# ── XCrawl 配置 ──
xcrawl:
  keys_env_vars:
  - xcrawl_key
  - xcrawl_key1
  - xcrawl_key2
  monthly_limit_per_key: 1000

# ================================================================
# 主力：XCrawl 搜索源（中文新闻，时效性最佳）
# ================================================================
other_sources:

# ── 即时零售核心 ──
- id: xcrawl_instant_retail_core
  name: XCrawl-即时零售核心动态
  method: xcrawl
  search_queries:
  - 即时零售 最新 新闻 2026
  - 即时零售 市场规模 增长
  - 即时零售 万亿 行业报告
  - 美团闪购 即时零售 2026
  - 京东秒送 京东到家 即时零售
  - 淘宝闪购 饿了么 即时零售
  description: 即时零售行业核心新闻
  source_tier: 1
  role: direct_signal
  category: 即时零售
  enabled: true
  max_items: 10
  daily_priority: 100

# ── 平台政策与监管 ──
