; R2-A supervisor draft.  NOT installed by this branch.
;
; Replace the absolute paths with the actual production checkout and state
; directory.  The scheduler is a normal Python process, not a QwenPaw agent.
; Keep credentials in the existing environment/secret mechanism; never put
; keys in this file.

[program:watsons-r2a-scheduler]
command=/app/venv/bin/python3 -m ops.r2a.scheduler --project-root /app/working/projects/watsons-retail-intel --state-dir /app/working/projects/watsons-retail-intel/data/ops --loop --mode scheduled --start-step extract --end-step analyze --hour 7 --minute 0 --window-minutes 90
directory=/app/working/projects/watsons-retail-intel
environment=PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
startsecs=5
startretries=3
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/app/working/projects/watsons-retail-intel/data/logs/supervisor_r2a_scheduler.out
stderr_logfile=/app/working/projects/watsons-retail-intel/data/logs/supervisor_r2a_scheduler.err
redirect_stderr=false

[program:watsons-r2a-watchdog]
; Run once per five minutes.  A non-zero exit is the alert signal; connect it
; to the existing notification channel only after review.
command=/bin/sh -c 'while true; do /app/venv/bin/python3 -m ops.r2a.watchdog --state-dir /app/working/projects/watsons-retail-intel/data/ops --max-age-hours 48 --stale-minutes 120 --require-scheduler >> /app/working/projects/watsons-retail-intel/data/logs/r2a_watchdog.out 2>&1 || true; sleep 300; done'
directory=/app/working/projects/watsons-retail-intel
environment=PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
startsecs=2
startretries=3
stdout_logfile=/app/working/projects/watsons-retail-intel/data/logs/supervisor_r2a_watchdog.out
stderr_logfile=/app/working/projects/watsons-retail-intel/data/logs/supervisor_r2a_watchdog.err
redirect_stderr=false
