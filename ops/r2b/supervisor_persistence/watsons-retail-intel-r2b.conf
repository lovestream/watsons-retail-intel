; R2-B persistent control-plane draft. NOT installed by this branch.
;
; Replace the absolute paths with the actual production checkout and state
; directory.  The scheduler is a normal Python process, not a QwenPaw agent.
; Keep credentials in the existing environment/secret mechanism; never put
; keys in this file.
;
; The scheduler starts at health_check, not extract.  This guarantees that a
; scheduled run executes information collection and filtering before reading
; an event pool; a pre-existing article pool must not masquerade as today's
; collection.  The pipeline still ends at analyze in R2-A: no report email.

[program:watsons-r2a-scheduler]
command=/app/venv/bin/python3 -m ops.r2a.scheduler --project-root /app/working/projects/watsons-retail-intel --state-dir /app/working/projects/watsons-retail-intel/data/ops --loop --mode scheduled --start-step health_check --end-step analyze --hour 7 --minute 0 --window-minutes 90
directory=/app/working/projects/watsons-retail-intel
environment=PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
startsecs=5
startretries=3
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/app/working/projects/watsons-retail-intel/data/logs/supervisor_r2a_scheduler.out
stderr_logfile=/app/working/projects/watsons-retail-intel/data/logs/supervisor_r2a_scheduler.err
redirect_stderr=false

[program:watsons-r2a-watchdog]
; Native Python loop, not a shell pipeline that discards exit codes.  A failed check preserves
; exit_code=1 in <state-dir>/watchdog/status.json and appends to the local
; alerts/events.jsonl sink.  The local preview is deliberately NOT emailed.
; The process remains alive after a failed check so recovery is detected on
; the next interval; the failure itself is never swallowed.
command=/app/venv/bin/python3 -m ops.r2a.watchdog --state-dir /app/working/projects/watsons-retail-intel/data/ops --max-age-hours 48 --stale-minutes 120 --require-scheduler --loop --interval 300
directory=/app/working/projects/watsons-retail-intel
environment=PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
startsecs=2
startretries=3
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/app/working/projects/watsons-retail-intel/data/logs/supervisor_r2a_watchdog.out
stderr_logfile=/app/working/projects/watsons-retail-intel/data/logs/supervisor_r2a_watchdog.err
redirect_stderr=false

; Control socket is intentionally in the persistent program file.  It becomes
; active only after an approved supervisor reread/restart; no production change
; is made by this branch.
[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; supervisorctl may be invoked with: supervisorctl -s unix:///var/run/supervisor.sock
